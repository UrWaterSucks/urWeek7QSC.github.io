<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Title</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div id="wrapper">
      <div id="box">
        <h1>Buy What I Don't Want Anymore</h1>
        <input type="text" id="name" placeholder="Your Name:" />
        <label for="items"></label>
        <select name="items" id="items">
          <option value="damp">Damp Rock-$2.00</option>
          <option value="dry">Dry Rock-$3.00</option>
          <option value="batman">That Tim Burton Batman Movie-70.00</option>
        </select>
        <input
          type="number"
          name="quantity"
          id="quantity"
          placeholder="Quantity:"
        />
        <button id="order">Order Now!</button>
      </div>
    </div>
    <script src="js/app.js"></script>
  </body>
</html>
